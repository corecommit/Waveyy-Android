name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode debug keystore
        run: |
          mkdir -p app
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore
          ls -la app/debug.keystore

      - name: Compute version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            IS_RELEASE=true
          else
            VERSION_NAME="1.0.${COMMIT_COUNT}-dev"
            IS_RELEASE=false
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME} (code=${COMMIT_COUNT}, release=${IS_RELEASE})"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          SOCKET_URL=${{ secrets.SOCKET_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SAAVN_API_URL=${{ secrets.SAAVN_API_URL }}
          EOF

      - name: Lint
        run: gradle :app:lintDebug --no-daemon --console=plain

      - name: Detekt
        run: gradle :app:detekt --no-daemon --console=plain

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble debug
        run: |
          gradle :app:assembleDebug \
            -PciVersionName=${{ steps.version.outputs.name }} \
            -PciVersionCode=${{ steps.version.outputs.code }} \
            --no-daemon --console=plain

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/waveyy.apk
          ls -la dist/

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: waveyy-debug-apk
          path: dist/waveyy.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/waveyy.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "Waveyy ${{ steps.version.outputs.name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord — APK ready
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA_SHORT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          DOWNLOAD_URL: "https://github.com/${{ github.repository }}/releases/latest/download/waveyy.apk"
        run: |
          SHA_SHORT="${SHA_SHORT:0:7}"
          if [[ "${IS_RELEASE}" == "true" ]]; then
            TITLE="🚀 **Waveyy ${VERSION_NAME} released**"
            URL="${DOWNLOAD_URL}"
            URL_LABEL="Direct download →"
            COLOR=3066993
          else
            TITLE="✅ **New debug build** — \`${VERSION_NAME}\`"
            URL="${RUN_URL}"
            URL_LABEL="Grab the APK from Artifacts →"
            COLOR=9807270
          fi
          jq -n \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg url_label "$URL_LABEL" \
            --arg color "$COLOR" \
            --arg commit_url "$COMMIT_URL" \
            --arg sha "$SHA_SHORT" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            --arg version "$VERSION_NAME" \
            '{
              content: $title,
              embeds: [{
                title: $url_label,
                url: $url,
                color: ($color | tonumber),
                fields: [
                  {name: "Version", value: $version, inline: true},
                  {name: "Branch", value: "`\($branch)`", inline: true},
                  {name: "Commit", value: "[`\($sha)`](\($commit_url))", inline: true},
                  {name: "Triggered by", value: $actor, inline: true}
                ],
                timestamp: (now | todate)
              }]
            }' | curl -sf -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          retention-days: 14

      - name: Notify Discord — build failed
        if: failure() || cancelled()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_WORKFLOWS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA_SHORT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          SHA_SHORT="${SHA_SHORT:0:7}"
          jq -n \
            --arg run_url "$RUN_URL" \
            --arg commit_url "$COMMIT_URL" \
            --arg sha "$SHA_SHORT" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            '{
              content: "❌ **Build failed** — \($repo)",
              embeds: [{
                title: "View failed run →",
                url: $run_url,
                color: 15158332,
                fields: [
                  {name: "Branch", value: "`\($branch)`", inline: true},
                  {name: "Commit", value: "[`\($sha)`](\($commit_url))", inline: true},
                  {name: "Triggered by", value: $actor, inline: true}
                ],
                timestamp: (now | todate)
              }]
            }' | curl -sf -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
