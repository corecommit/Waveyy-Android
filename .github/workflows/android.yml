name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode debug keystore
        run: |
          mkdir -p app
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore
          ls -la app/debug.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          SOCKET_URL=${{ secrets.SOCKET_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SAAVN_API_URL=${{ secrets.SAAVN_API_URL }}
          EOF

      - name: Lint
        run: gradle :app:lintDebug --no-daemon --console=plain

      - name: Detekt
        run: gradle :app:detekt --no-daemon --console=plain

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waveyy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          retention-days: 14

  # Optional signed release bundle. The gate lives in shell (not in a
  # job-level `if`), so an unconfigured keystore can never invalidate the
  # workflow: the job simply skips the bundle step.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          SOCKET_URL=${{ secrets.SOCKET_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SAAVN_API_URL=${{ secrets.SAAVN_API_URL }}
          RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore
          RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Decode keystore or skip release
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            echo "No keystore secret; bundle step will skip."
          else
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          fi

      - name: Bundle release
        if: env.SKIP_RELEASE != 'true'
        run: gradle :app:bundleRelease --no-daemon --console=plain

      - name: Upload AAB
        if: env.SKIP_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: waveyy-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
