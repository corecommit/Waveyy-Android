name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode debug keystore
        run: |
          mkdir -p app
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore
          ls -la app/debug.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          SOCKET_URL=${{ secrets.SOCKET_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SAAVN_API_URL=${{ secrets.SAAVN_API_URL }}
          EOF

      - name: Lint
        run: gradle :app:lintDebug --no-daemon --console=plain

      - name: Detekt
        run: gradle :app:detekt --no-daemon --console=plain

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waveyy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Notify Discord — APK ready
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA_SHORT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          SHA_SHORT="${SHA_SHORT:0:7}"
          jq -n \
            --arg run_url "$RUN_URL" \
            --arg commit_url "$COMMIT_URL" \
            --arg sha "$SHA_SHORT" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            '{
              content: "✅ **New debug APK ready** — \($repo)",
              embeds: [{
                title: "Download waveyy-debug-apk →",
                url: $run_url,
                description: "Open the run page and grab the APK from the **Artifacts** section.",
                color: 3066993,
                fields: [
                  {name: "Branch", value: "`\($branch)`", inline: true},
                  {name: "Commit", value: "[`\($sha)`](\($commit_url))", inline: true},
                  {name: "Triggered by", value: $actor, inline: true}
                ],
                timestamp: (now | todate)
              }]
            }' | curl -sf -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          retention-days: 14

      - name: Notify Discord — build failed
        if: failure() || cancelled()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_WORKFLOWS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA_SHORT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          SHA_SHORT="${SHA_SHORT:0:7}"
          jq -n \
            --arg run_url "$RUN_URL" \
            --arg commit_url "$COMMIT_URL" \
            --arg sha "$SHA_SHORT" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            '{
              content: "❌ **Build failed** — \($repo)",
              embeds: [{
                title: "View failed run →",
                url: $run_url,
                color: 15158332,
                fields: [
                  {name: "Branch", value: "`\($branch)`", inline: true},
                  {name: "Commit", value: "[`\($sha)`](\($commit_url))", inline: true},
                  {name: "Triggered by", value: $actor, inline: true}
                ],
                timestamp: (now | todate)
              }]
            }' | curl -sf -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

  # Optional signed release bundle. The gate lives in shell (not in a
  # job-level `if`), so an unconfigured keystore can never invalidate the
  # workflow: the job simply skips the bundle step.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          SOCKET_URL=${{ secrets.SOCKET_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SAAVN_API_URL=${{ secrets.SAAVN_API_URL }}
          RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore
          RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Decode keystore or skip release
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            echo "No keystore secret; bundle step will skip."
          else
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          fi

      - name: Bundle release
        if: env.SKIP_RELEASE != 'true'
        run: gradle :app:bundleRelease --no-daemon --console=plain

      - name: Upload AAB
        if: env.SKIP_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: waveyy-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Notify Discord — release AAB ready
        if: success() && env.SKIP_RELEASE != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA_SHORT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          SHA_SHORT="${SHA_SHORT:0:7}"
          jq -n \
            --arg run_url "$RUN_URL" \
            --arg commit_url "$COMMIT_URL" \
            --arg sha "$SHA_SHORT" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            '{
              content: "📦 **New release AAB ready** — \($repo)",
              embeds: [{
                title: "Download waveyy-release-aab →",
                url: $run_url,
                color: 3447003,
                fields: [
                  {name: "Branch", value: "`\($branch)`", inline: true},
                  {name: "Commit", value: "[`\($sha)`](\($commit_url))", inline: true},
                  {name: "Triggered by", value: $actor, inline: true}
                ],
                timestamp: (now | todate)
              }]
            }' | curl -sf -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

      - name: Notify Discord — release failed
        if: failure() || cancelled()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_WORKFLOWS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA_SHORT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          SHA_SHORT="${SHA_SHORT:0:7}"
          jq -n \
            --arg run_url "$RUN_URL" \
            --arg commit_url "$COMMIT_URL" \
            --arg sha "$SHA_SHORT" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            '{
              content: "❌ **Release job failed** — \($repo)",
              embeds: [{
                title: "View failed run →",
                url: $run_url,
                color: 15158332,
                fields: [
                  {name: "Branch", value: "`\($branch)`", inline: true},
                  {name: "Commit", value: "[`\($sha)`](\($commit_url))", inline: true},
                  {name: "Triggered by", value: $actor, inline: true}
                ],
                timestamp: (now | todate)
              }]
            }' | curl -sf -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
